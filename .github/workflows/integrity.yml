name: Metadata and utility checks
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python scripts/check_release_privacy.py
      - run: python -m unittest discover -s tests -p 'test_release_privacy.py' -v
      - run: python -m unittest discover -s tests -p 'test_reproduction.py' -v
      - run: python -m unittest discover -s tests -p 'test_publication_compatibility.py' -v
      - run: python -m unittest discover -s tests -p 'test_artifacts.py' -v
      - run: python -m unittest discover -s tests -p 'test_eval_contracts.py' -v
      - run: python -m unittest discover -s tests -p 'test_task_planning_portability.py' -v
      - run: python -m unittest discover -s tests -p 'test_snapshot_integrity.py' -v
      - run: python scripts/check_preview.py
      - run: python -m compileall -q src scripts tests third_party/tuningfactory/src
      - run: bash -n scripts/train.sh
