task: cosmos-agibot
dataset_path: /path/to/evaluation/dataset
dataset_kwargs:
  video_dir: /path/to/evaluation/media
  sub_task: agibot
  pre_prompt: ""
  post_prompt: "\nAnswer with the option's letter from the given choices directly."
load_from_disk: true
eval_split: null
dataset_name: agibot
doc_to_visual: !function process.cosmos_doc_to_visual
doc_to_text: !function process.cosmos_doc_to_text
doc_to_target: !function process.cosmos_doc_to_target
output_type: generate_until
generation_kwargs:
  # MCQ tasks do not need very long generations; large values can easily OOM on GPU.
  max_new_tokens: 4096
  temperature: 0
  do_sample: false
  top_p: 1.0
  num_beams: 1
# metrics
process_results: !function process.cosmos_process_results
metric_kwargs:
  metric: accuracy
  aggregation: !function process.cosmos_aggregate_results
  higher_is_better: true



